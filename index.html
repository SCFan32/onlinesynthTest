<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FM Sweep — Faust WASM</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
  }
  #startBtn {
    font-size: 1.5rem;
    padding: 1rem 2.5rem;
    border-radius: 12px;
    border: none;
    background: #4caf50;
    color: white;
    cursor: pointer;
  }
  #startBtn:disabled { background: #666; }
  #status {
    position: fixed;
    bottom: 2rem;
    font-size: 0.9rem;
    color: #999;
  }
</style>
</head>
<body>
  <button id="startBtn">▶ Start</button>
  <div id="status">Tap to start audio</div>

  <script type="module" src="./app.js"></script>
</body>
</html>
