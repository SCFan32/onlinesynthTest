<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FM Synth — Faust WASM</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    touch-action: none; /* prevent scroll/zoom while dragging the pad */
  }

  #controls {
    display: flex;
    gap: 1rem;
  }

  button {
    font-size: 1.1rem;
    padding: 0.8rem 1.6rem;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: #333;
    color: #eee;
  }
  button:disabled { background: #444; color: #777; cursor: default; }

  #powerBtn.on { background: #4caf50; color: white; }
  #muteBtn.muted { background: #a33; color: white; }

  #xyPad {
    position: relative;
    width: min(80vw, 360px);
    height: min(80vw, 360px);
    background: #1c1c1c;
    border: 2px solid #333;
    border-radius: 16px;
    opacity: 0.5;
    touch-action: none;
  }
  #xyPad.active {
    opacity: 1;
    border-color: #4caf50;
  }

  #xyPad::before, #xyPad::after {
    content: "";
    position: absolute;
    background: #2a2a2a;
  }
  #xyPad::before { left: 0; right: 0; top: 50%; height: 1px; }
  #xyPad::after { top: 0; bottom: 0; left: 50%; width: 1px; }

  #xyDot {
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #4caf50;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow: 0 0 12px rgba(76, 175, 80, 0.8);
  }

  .axisLabel {
    position: absolute;
    font-size: 0.7rem;
    color: #777;
    pointer-events: none;
  }
  .axisLabel.top { top: 6px; left: 50%; transform: translateX(-50%); }
  .axisLabel.bottom { bottom: 6px; left: 50%; transform: translateX(-50%); }
  .axisLabel.left { left: 8px; top: 50%; transform: translateY(-50%) rotate(-90deg); }
  .axisLabel.right { right: 8px; top: 50%; transform: translateY(-50%) rotate(90deg); }

  #status {
    font-size: 0.9rem;
    color: #999;
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <div id="controls">
    <button id="powerBtn" disabled>⏻ Off</button>
    <button id="muteBtn">🔊 Sound</button>
  </div>

  <div id="xyPad">
    <div id="xyDot"></div>
    <div class="axisLabel top">index ↑</div>
    <div class="axisLabel bottom">index ↓</div>
    <div class="axisLabel left">freq ↓</div>
    <div class="axisLabel right">freq ↑</div>
  </div>

  <div id="status">Preparing synth…</div>

  <script type="module" src="./app.js"></script>
</body>
</html>
